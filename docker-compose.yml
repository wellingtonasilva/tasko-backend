version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: tasko-db
    environment:
      POSTGRES_DB: tasko
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tasko-network

  # Tasko Backend Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tasko-backend
    ports:
      - "8080:8080"
    environment:
      # Spring Profile
      SPRING_PROFILES_ACTIVE: prod

      # Database Configuration
      DATABASE_URL: jdbc:postgresql://db:5432/tasko
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

      # Server Configuration
      PORT: 8080

      # JVM Options
      JAVA_OPTS: -Xms512m -Xmx1024m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - tasko-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  tasko-network:
    driver: bridge

